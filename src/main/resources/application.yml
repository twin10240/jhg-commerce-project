# 로컬 기본은 8080, Railway 등 PaaS는 주입되는 ${PORT}에 바인딩한다.
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: OMSSESSION

spring:
  datasource:
#    url: jdbc:h2:~/hgpage
    url: jdbc:h2:tcp://localhost/~/hgpage
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      # 기본: 데이터 보존(update). 스키마를 갈아엎고 다시 시드하려면 local 프로파일로 실행:
      #   .\gradlew.bat bootRun --args='--spring.profiles.active=local'
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100

  # H2 환경(로컬/개발)에서는 Flyway 비활성 — H2 드라이버 모듈 없음 + ddl-auto로 스키마 관리
  flyway:
    enabled: false

  # ddl-auto가 스키마를 갱신한 뒤 기존 로컬 데이터를 멱등 변환한다.
  sql:
    init:
      mode: always
      data-locations: classpath:db/local-data-migration.sql

  logging:
    level:
      org.hibernate.SQL: debug
      org.hibernate.type.descriptor.sql.BasicBinder: trace

  # S4: WMS REST 호출 공통 타임아웃 — WMS hang 시 무기한 블록 방지.
  # 자동구성 RestClient.Builder 전체(어댑터 3종)에 적용(Spring Boot 3.4+).
  http:
    client:
      connect-timeout: 1s
      read-timeout: 2s

wms:
  # 로컬 기본 8081, 운영은 WMS_BASE_URL 주입(Railway private networking: http://<wms>.railway.internal:8081)
  base-url: ${WMS_BASE_URL:http://localhost:8081}
  # WMS가 Basic 인증을 요구하므로 같은 자격증명을 실어 보낸다. 로컬 기본값은 wms/wms(WMS와 일치).
  basic:
    user: ${WMS_BASIC_USER:wms}
    password: ${WMS_BASIC_PASSWORD:wms}

oms:
  callback:
    user: ${OMS_CALLBACK_USER:wms}
    password: ${OMS_CALLBACK_PASSWORD:wms}

payments:
  sweep-delay: ${PAYMENT_SWEEP_DELAY:5s}
  processing-timeout: ${PAYMENT_PROCESSING_TIMEOUT:5m}
allocation:
  sweep-delay: ${ALLOCATION_SWEEP_DELAY:5s}
  processing-timeout: ${ALLOCATION_PROCESSING_TIMEOUT:5m}
refunds:
  sweep-delay: ${REFUND_SWEEP_DELAY:5s}
  processing-timeout: ${REFUND_PROCESSING_TIMEOUT:5m}
cancellations:
  sweep-delay: ${CANCELLATION_SWEEP_DELAY:5s}
  processing-timeout: ${CANCELLATION_PROCESSING_TIMEOUT:5m}

---
# 로컬 수동 검증 전용: 공개 제어 API 없이 프로세스 재시작으로 모의 PG 결과를 선택한다.
spring:
  config:
    activate:
      on-profile: payment-faults
mock-payment:
  approval-outcome: ${MOCK_PAYMENT_APPROVAL_OUTCOME:SUCCESS}
  refund-outcome: ${MOCK_PAYMENT_REFUND_OUTCOME:SUCCESS}

---
# 리셋용 프로파일: 스키마 DROP & 재생성 (시드는 initDb가 빈 DB를 감지해 자동 실행)
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: create

---
# 운영 프로파일(Railway): PostgreSQL + Flyway
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway가 스키마를 관리한다. Hibernate는 검증만 수행.
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
  sql:
    init:
      mode: never
decorator:
  datasource:
    p6spy:
      enable-logging: false
oms:
  callback:
    user: ${OMS_CALLBACK_USER}
    password: ${OMS_CALLBACK_PASSWORD}
