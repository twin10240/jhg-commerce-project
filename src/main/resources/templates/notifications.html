<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>알림 · 그니마켓</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="margin:0;padding:24px;background:var(--app-bg);color:var(--app-ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif">
<div th:replace="~{fragments/layout :: nav('notifications')}"></div>
<main class="app-shell">
  <h1 class="app-title">알림</h1>
  <div class="order-actions">
    <label><input type="checkbox" data-notification-unread-filter> 읽지 않은 알림만 보기</label>
    <button class="app-btn secondary" type="button" data-notification-read-all>모두 읽음</button>
  </div>

  <section aria-live="polite" aria-busy="true" data-notification-list>
    <p role="status" data-notification-loading>알림을 불러오는 중입니다.</p>
    <div class="empty-state" data-notification-empty hidden>
      <p>새 알림이 없습니다.</p>
    </div>
    <div data-notification-items></div>
    <div data-notification-retry hidden>
      <p>알림을 불러오지 못했습니다.</p>
      <button class="app-btn secondary" type="button">다시 시도</button>
    </div>
  </section>
</main>
</body>
</html>
