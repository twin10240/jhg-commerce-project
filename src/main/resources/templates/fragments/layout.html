<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="site-nav" th:fragment="nav(active)">
  <a class="site-brand" th:href="@{/main}">그니마켓</a>
  <a th:href="@{/main}" th:classappend="${active == 'products'} ? 'active'">상품</a>
  <a sec:authorize="hasRole('USER')" th:href="@{/cart}" th:classappend="${active == 'cart'} ? 'active'">장바구니</a>
  <a sec:authorize="hasRole('USER')" th:href="@{/orders}" th:classappend="${active == 'orders'} ? 'active'">내 주문</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/inventory}" th:classappend="${active == 'inventory'} ? 'active'">재고 현황</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/replenishment-requests}" th:classappend="${active == 'replenishment'} ? 'active'">보충 요청</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/orders}" th:classappend="${active == 'shipping'} ? 'active'">배송 관리</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/payments}" th:classappend="${active == 'payments'} ? 'active'">결제·환불 관리</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/returns}" th:classappend="${active == 'returns'} ? 'active'">반품 관리</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/notification-events}" th:classappend="${active == 'notification-events'} ? 'active'">알림 이벤트</a>
  <form th:action="@{/logout}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit">로그아웃</button>
  </form>
  <div sec:authorize="hasRole('USER')"
       id="notification-root"
       th:attr="data-realtime-url=${realtimePublicUrl},
                data-csrf-header=${_csrf.headerName},
                data-csrf-token=${_csrf.token}"></div>
  <script sec:authorize="hasRole('USER')"
          th:src="|${realtimePublicUrl}/socket.io/socket.io.js|" defer></script>
  <script sec:authorize="hasRole('USER')"
          th:src="@{/js/notification-client.js}" defer></script>
</nav>
</body>
</html>
