<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>반품 관리 · OMS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    .filters{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:18px 0}.filters label{display:grid;gap:6px;color:var(--app-muted);font-size:13px}.filters select{min-width:180px;padding:10px;border:1px solid var(--app-line);border-radius:8px;background:var(--app-card);color:var(--app-ink);font:inherit}.flash{padding:12px 14px;margin:14px 0;border:1px solid #b9dfc8;border-radius:8px;background:#eaf7ef;color:var(--app-ok);font-weight:700}.flash.error{border-color:#e3b4ac;background:#fdeaea;color:var(--app-danger)}.table-wrap{overflow-x:auto}.returns-table{width:100%;min-width:1480px;border-collapse:collapse}.returns-table th,.returns-table td{padding:11px 9px;border-bottom:1px solid var(--app-line);text-align:left;font-size:13px;vertical-align:top}.returns-table th{color:var(--app-muted);white-space:nowrap}.items{margin:0;padding-left:18px;white-space:nowrap}.row-actions{display:flex;gap:8px;align-items:center;white-space:nowrap}.row-actions form{margin:0}.row-actions input{width:130px;padding:9px;border:1px solid var(--app-line);border-radius:8px;font:inherit}
    @media(max-width:720px){.filters{align-items:stretch;flex-direction:column}.filters label,.filters select,.filters .app-btn{width:100%}.returns-table{min-width:1300px}.row-actions{align-items:stretch;flex-direction:column}.row-actions input{width:100%}}
    @media(prefers-color-scheme:dark){.flash{background:#173528}.flash.error{background:#3c2020}}
  </style>
</head>
<body style="margin:0;padding:24px;background:var(--app-bg);color:var(--app-ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif">
<div th:replace="~{fragments/layout :: nav('returns')}"></div>
<main class="app-shell">
  <header>
    <h1 class="app-title">반품 관리</h1>
    <p class="app-subtitle">고객 반품 요청을 검토하고 승인 후 WMS 접수를 확인합니다.</p>
  </header>

  <form class="filters" method="get" th:action="@{/admin/returns}">
    <label>반품 상태
      <select name="status">
        <option value="">전체</option>
        <option th:each="value : ${statuses}" th:value="${value}"
                th:selected="${value == activeStatus}" th:text="${value.label}">OMS 승인 대기</option>
      </select>
    </label>
    <button class="app-btn" type="submit">조회</button>
  </form>

  <div class="flash" role="status" th:if="${successMessage}" th:text="${successMessage}">반품을 승인했습니다.</div>
  <div class="flash error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">오류 메시지</div>

  <section class="app-card" aria-labelledby="returns-table-title">
    <h2 id="returns-table-title" style="margin:0 0 12px">반품 요청</h2>
    <div class="table-wrap">
      <table class="returns-table">
        <thead><tr><th>반품번호</th><th>주문번호</th><th>고객</th><th>요청 품목</th><th>반품 사유</th><th>상태</th><th>요청일시</th><th>검토자</th><th>검토일시</th><th>반려 사유</th><th>실패 사유</th><th>처리</th></tr></thead>
        <tbody>
        <tr th:each="row : ${returns}">
          <td th:text="${row.id}">77</td>
          <td th:text="${row.orderId}">10</td>
          <td th:text="${row.customerName}">테스터</td>
          <td><ul class="items"><li th:each="item : ${row.items}" th:text="|${item.productName} ${item.quantity}개|">상품 1 2개</li></ul></td>
          <td th:text="${row.reason}">상품 불량</td>
          <td th:text="${row.statusLabel}">OMS 승인 대기</td>
          <td th:text="${#temporals.format(row.requestedAt,'yyyy-MM-dd HH:mm')}">2026-08-26 10:30</td>
          <td th:text="${row.reviewedBy ?: '-'}">-</td>
          <td th:text="${row.reviewedAt == null ? '-' : #temporals.format(row.reviewedAt,'yyyy-MM-dd HH:mm')}">-</td>
          <td th:text="${row.rejectionReason ?: '-'}">-</td>
          <td th:text="${row.failureReason ?: '-'}">-</td>
          <td><div class="row-actions" th:if="${row.status.name() == 'PENDING_APPROVAL'}">
            <form th:action="@{/admin/returns/{id}/approve(id=${row.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="app-btn" type="submit">승인</button>
            </form>
            <form th:action="@{/admin/returns/{id}/reject(id=${row.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <input name="reason" maxlength="500" required aria-label="반려 사유">
              <button class="app-btn secondary" type="submit">반려</button>
            </form>
          </div></td>
        </tr>
        <tr th:if="${#lists.isEmpty(returns)}"><td colspan="12" class="empty-state">조건에 맞는 반품 요청이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
