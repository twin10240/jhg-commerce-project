<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>재고 보충 요청 · OMS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    .request-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(110px,1fr) minmax(0,2fr) auto;gap:12px;align-items:end;margin-top:18px}.request-form label{display:grid;min-width:0;gap:6px;color:var(--app-muted);font-size:13px}.request-form input,.request-form select{box-sizing:border-box;width:100%;height:44px;min-width:0;padding:0 11px;border:1px solid var(--app-line);border-radius:10px;background:var(--app-card);color:var(--app-ink);font:inherit}.request-form .app-btn{height:44px;white-space:nowrap}
    .request-table{width:100%;border-collapse:collapse;margin-top:16px}.request-table th,.request-table td{padding:12px 9px;border-bottom:1px solid var(--app-line);text-align:left;font-size:14px}.request-table th{color:var(--app-muted);font-size:13px}.flash{margin:14px 0;padding:12px 14px;border-radius:10px}.flash.success{background:#eaf7ef;color:var(--app-ok)}.flash.error{background:#fdeaea;color:var(--app-danger)}
    @media(max-width:900px){.request-form{grid-template-columns:1fr}.request-form .app-btn{width:100%}}@media(max-width:720px){.table-wrap{max-width:100%}.table-wrap{overflow-x:auto}.request-table{min-width:620px}.mobile-hide{display:none}}
  </style>
</head>
<body style="margin:0;padding:24px;background:var(--app-bg);color:var(--app-ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif">
<div th:replace="~{fragments/layout :: nav('replenishment')}"></div>
<main class="app-shell">
  <header style="display:flex;justify-content:space-between;align-items:start;gap:12px">
    <div><h1 class="app-title">재고 보충 요청</h1><p class="app-subtitle">OMS는 요청과 진행 상황을 관리하고, 승인·발주·입고는 WMS가 처리합니다.</p></div>
    <a class="app-btn secondary" th:href="@{/admin/inventory}">재고 현황</a>
  </header>
  <div class="flash success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="flash error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <section class="app-card" style="margin-top:18px">
    <h2 style="margin:0">새 요청</h2>
    <form class="request-form" th:action="@{/admin/replenishment-requests}" th:object="${requestForm}" method="post">
      <input type="hidden" th:field="*{requestKey}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>상품
        <select th:field="*{items[0].productId}" required>
          <option value="">상품 선택</option>
          <option th:each="product : ${products}" th:value="${product.productId}"
                  th:text="|${product.productName} (#${product.productId}) · 가용 ${product.availableQty}개|">상품 1</option>
        </select>
      </label>
      <label>요청 수량 <input type="number" min="1" th:field="*{items[0].requestedQty}" required></label>
      <label>요청 사유 <input type="text" th:field="*{reason}" placeholder="입고 대기 주문 대응" required></label>
      <button class="app-btn" type="submit">WMS에 요청</button>
    </form>
  </section>

  <section class="app-card" style="margin-top:18px">
    <h2 style="margin:0">요청 이력 <small class="status-badge status-backordered" th:if="${pendingRequestCount > 0}" th:text="|진행 중 ${pendingRequestCount}건|">진행 중</small></h2>
    <div class="table-wrap">
      <table class="request-table">
        <thead><tr><th>요청</th><th>상품·수량</th><th class="mobile-hide">사유</th><th>진행 상태</th><th class="mobile-hide">요청일</th><th class="mobile-hide">WMS 메모</th><th class="mobile-hide">발주</th></tr></thead>
        <tbody>
        <tr th:each="request : ${requests}" th:id="|request-${request.id}|">
          <td th:text="|#${request.id}|">#1</td>
          <td><span th:each="item, stat : ${request.items}"><strong th:text="${productNames.getOrDefault(item.productId, '상품 #' + item.productId)}">상품</strong><span th:text="| × ${item.requestedQty}|"> × 3</span><span th:if="${!stat.last}">, </span></span></td>
          <td class="mobile-hide" th:text="${request.reason}">사유</td>
          <td>
            <span class="status-badge"
                  th:classappend="${request.status == 'FULFILLED'} ? 'status-order' : (${request.status == 'REJECTED'} ? 'status-cancel' : 'status-backordered')"
                  th:text="${request.status == 'REQUESTED'} ? 'WMS 검토 대기' : (${request.status == 'APPROVED'} ? '발주·입고 진행' : (${request.status == 'FULFILLED'} ? '입고 완료' : '반려'))">상태</span>
          </td>
          <td class="mobile-hide" th:text="${#temporals.format(request.requestedAt,'yyyy-MM-dd HH:mm')}">2026-07-25</td>
          <td class="mobile-hide" th:text="${request.wmsMemo ?: '-'}">-</td>
          <td class="mobile-hide" th:text="${request.purchaseOrderId != null ? '#' + request.purchaseOrderId : '-'}">-</td>
        </tr>
        <tr th:if="${#lists.isEmpty(requests)}"><td colspan="7" class="empty-state">아직 보충 요청이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
