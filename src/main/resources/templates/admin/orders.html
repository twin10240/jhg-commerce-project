<!-- templates/admin/orders.html : 관리자 배송 관리 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>배송 관리</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">

  <style>
    :root{
      --bg1:#fff7ed; --bg2:#fde7d8; --bg3:#fae8ff;
      --card:#fffaf5; --ink:#443c33; --muted:#7a6f66;
      --accent1:#f4a261; --accent2:#e76f51;
      --radius:18px; --shadow:0 20px 45px rgba(68,60,51,.18);
    }
    *{box-sizing:border-box}
    html{height:100%}
    body{
      min-height:100%;
      margin:0; color:var(--ink);
      font-family:ui-sans-serif, system-ui, -apple-system,"Segoe UI",Roboto,"Noto Sans KR",Arial,"Apple SD Gothic Neo";
      background:
              radial-gradient(1200px 700px at 80% 10%, var(--bg3) 0%, transparent 60%),
              radial-gradient(900px 600px at 10% 90%, var(--bg2) 0%, transparent 60%),
              linear-gradient(180deg, var(--bg1), #fff);
      background-repeat:no-repeat;
      background-attachment:fixed;
      padding:24px;
    }
    .container{max-width:1080px; margin:0 auto}

    .page-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
    .page-title{font-size:24px; font-weight:800; letter-spacing:-.2px}
    .page-desc{color:var(--muted); font-size:13px; margin-top:4px}

    .card{
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:20px 18px;
      animation:fade .3s ease;
    }
    @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

    .btn{
      appearance:none; border:0; cursor:pointer;
      padding:10px 14px; border-radius:12px; color:white; font-weight:700;
      background:linear-gradient(135deg, var(--accent1), var(--accent2));
      box-shadow:0 10px 20px rgba(231,111,81,.3), 0 2px 6px rgba(0,0,0,.06);
      text-decoration:none; font-size:14px;
    }
    .btn.outline{background:#fff; color:#6e6259; border:1px solid #eadfd6; box-shadow:none}
    .btn.small{padding:6px 12px; font-size:13px}
    .btn:disabled{cursor:not-allowed;opacity:.45;box-shadow:none}
    .bulk-actions{display:flex;align-items:center;gap:10px}
    .shipment-order-checkbox{width:18px;height:18px;accent-color:var(--accent2)}

    .flash{
      margin-bottom:14px; padding:12px 16px; border-radius:10px; font-size:14px;
    }
    .flash.success{border:1px solid #b7d9b0; color:#2e7d32; background:#f1f8ef}
    .flash.error{border:1px solid #e3b4ac; color:#c0392b; background:#fdf3f1}

    table{width:100%; border-collapse:separate; border-spacing:0 8px}
    th,td{padding:10px 12px; text-align:left; font-size:14px}
    thead th{color:#7a6f66; font-weight:700}
    tbody tr{background:var(--card); border:1px solid #eadfd6; border-radius:12px}
    tbody tr td:first-child{border-top-left-radius:12px; border-bottom-left-radius:12px}
    tbody tr td:last-child{border-top-right-radius:12px; border-bottom-right-radius:12px}
    .right{text-align:right}
    .hint{color:var(--muted); font-size:12px}
    .payment-status{white-space:nowrap}

    .status-badge{
      display:inline-block; padding:3px 10px; border-radius:999px;
      font-size:12px; font-weight:800; white-space:nowrap;
    }
    .status-badge.order{color:#8a6d3b; background:#fcf6e8; border:1px solid #e7d3a1}
    .status-badge.cancel{color:#c0392b; background:#fdf3f1; border:1px solid #e3b4ac}
    .status-badge.backorder{color:#a4690f; background:#fff4e0; border:1px solid #ecd2a3}
    .status-badge.ready{color:#1f5f8b; background:#eef6fb; border:1px solid #b5d4e8}
    .status-badge.shipped{color:#8a6d3b; background:#fcf6e8; border:1px solid #e7d3a1}
    .status-badge.delivered{color:#2e7d32; background:#f1f8ef; border:1px solid #b7d9b0}
    .order-lines,.quantity-lines{display:grid;gap:6px}.order-lines{min-width:150px}.order-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.inbound-required{color:#a4690f;font-size:12px;font-weight:800}
    @media(max-width:720px){.page-head{align-items:flex-start;flex-direction:column}.bulk-actions{align-items:stretch;width:100%}.bulk-actions .btn{width:100%}.table-wrap{max-width:100%}.table-wrap{overflow-x:auto}table{min-width:950px}.mobile-hide{display:none}}

    @media (prefers-color-scheme: dark){
      body{background:linear-gradient(180deg,#1b1917,#26211d); background-attachment:fixed}
      .card{background:#201d1a; color:#f1eee9}
      thead th{color:#bfb4a9}
      tbody tr{background:#161412; border-color:#39322c}
      .btn.outline{background:#161412; border-color:#39322c; color:#d9d4cf}
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/layout :: nav('shipping')}"></div>
<div class="container">
  <div class="page-head">
    <div>
      <div class="page-title">배송 관리</div>
      <div class="page-desc">배송 가능·입고 대기 주문을 우선 표시하며, 진행 중 주문은 오래된 순서로 처리합니다.</div>
    </div>
    <form id="bulk-shipment-form" class="bulk-actions"
          th:action="@{/admin/orders/ships}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button id="bulk-shipment-button" class="btn" type="submit" disabled>선택 출고 처리</button>
    </form>
  </div>

  <div class="flash success" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="flash error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <div class="card table-wrap">
    <table>
      <thead>
      <tr>
        <th style="width:44px">
          <input id="select-all-orders" class="shipment-order-checkbox" type="checkbox"
                 aria-label="출고 가능 주문 전체 선택">
        </th>
        <th style="width:90px">주문번호</th>
        <th style="width:140px">주문자</th>
        <th style="width:150px">주문 상품</th>
        <th class="right" style="width:70px">수량</th>
        <th style="width:100px">주문상태</th>
        <th class="payment-status" style="width:110px">결제상태</th>
        <th style="width:100px">배송상태</th>
        <th class="right mobile-hide" style="width:120px">주문금액</th>
        <th class="mobile-hide" style="width:150px">주문일시</th>
        <th style="width:120px">처리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="o : ${orders}">
        <td>
          <input th:if="${o.shippable}" class="shipment-order-checkbox shipment-order-item"
                 type="checkbox" name="orderIds" th:value="${o.id}" form="bulk-shipment-form"
                 th:aria-label="|주문 #${o.id} 선택|">
        </td>
        <td th:text="${o.id}">101</td>
        <td th:text="${o.memberName}">주문자A</td>
        <td>
          <div class="order-lines">
            <div class="order-line" th:each="item : ${o.items}">
              <span th:text="${item.productName}">상품1</span>
              <span class="inbound-required" th:if="${item.inboundRequired}">입고 필요</span>
            </div>
          </div>
        </td>
        <td class="right">
          <div class="quantity-lines">
            <div th:each="item : ${o.items}" th:text="${item.quantity}">2</div>
          </div>
        </td>
        <td>
          <span class="status-badge"
                th:classappend="${o.status.name() == 'CANCEL' or o.status.name() == 'PAYMENT_FAILED'} ? 'cancel' : (${o.status.name() == 'BACKORDERED' or o.status.name() == 'ALLOCATION_REVIEW'} ? 'backorder' : 'order')"
                th:utext="${#strings.replace(o.orderStatusLabel, ' · ', '&lt;br&gt;')}">재고 확보</span>
        </td>
        <td class="payment-status" th:text="${o.paymentStatusLabel}">결제 완료</td>
        <td>
          <span class="status-badge"
                th:classappend="${o.deliveryStatus.name() == 'DELIVERED'} ? 'delivered' : (${o.deliveryStatus.name() == 'SHIPPED'} ? 'shipped' : 'ready')"
                th:text="${o.deliveryStatus.name() == 'DELIVERED'} ? '배송 완료' : (${o.deliveryStatus.name() == 'SHIPPED'} ? '출고 완료' : '출고 준비')">출고 준비</span>
        </td>
        <td class="right mobile-hide"><span th:text="${#numbers.formatInteger(o.totalPrice,1,'COMMA')}">23,000</span>원</td>
        <td class="mobile-hide" th:text="${#temporals.format(o.orderDate,'yyyy-MM-dd HH:mm')}">2026-06-12 10:22</td>
        <td>
          <form th:if="${o.shippable}" th:action="@{/admin/orders/ship}" method="post"
                onsubmit="return confirm('이 주문을 출고 처리하시겠습니까?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="orderId" th:value="${o.id}" />
            <button class="btn small" type="submit">출고 처리</button>
          </form>
          <form th:if="${o.deliverable}" th:action="@{/admin/orders/deliver}" method="post"
                onsubmit="return confirm('이 주문을 배송 완료 처리하시겠습니까?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="orderId" th:value="${o.id}" />
            <button class="btn small" type="submit">배송 완료</button>
          </form>
          <form th:if="${o.allocationRetryable or o.cancellationAllocationRetryable}"
                th:action="@{/admin/orders/{orderId}/allocation/retry(orderId=${o.id})}" method="post"
                onsubmit="return confirm('재고 처리를 다시 시도하시겠습니까?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn small" type="submit">재고 다시 처리</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="11" class="hint">주문 내역이 없습니다.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
<script>
  const shipmentBoxes = [...document.querySelectorAll('.shipment-order-item')];
  const selectAllOrders = document.getElementById('select-all-orders');
  const bulkShipmentButton = document.getElementById('bulk-shipment-button');
  const bulkShipmentForm = document.getElementById('bulk-shipment-form');

  function syncShipmentSelection() {
    const selectedCount = shipmentBoxes.filter(checkbox => checkbox.checked).length;
    bulkShipmentButton.disabled = selectedCount === 0;
    selectAllOrders.checked = shipmentBoxes.length > 0 && selectedCount === shipmentBoxes.length;
    selectAllOrders.indeterminate = selectedCount > 0 && selectedCount < shipmentBoxes.length;
  }

  selectAllOrders.disabled = shipmentBoxes.length === 0;
  selectAllOrders.addEventListener('change', () => {
    shipmentBoxes.forEach(checkbox => checkbox.checked = selectAllOrders.checked);
    syncShipmentSelection();
  });
  shipmentBoxes.forEach(checkbox => checkbox.addEventListener('change', syncShipmentSelection));
  bulkShipmentForm.addEventListener('submit', event => {
    const selectedCount = shipmentBoxes.filter(checkbox => checkbox.checked).length;
    if (selectedCount === 0 || !confirm(`선택한 ${selectedCount}건을 출고 처리하시겠습니까?`)) {
      event.preventDefault();
    }
  });
</script>
</body>
</html>
