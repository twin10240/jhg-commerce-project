<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상담 관리</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav('chat')}"></div>
<main class="chat-page chat-admin" data-chat-root data-chat-role="ADMIN" th:attr="data-chat-requested-conversation-id=${conversationId},data-csrf-header=${_csrf.headerName},data-csrf-token=${_csrf.token}">
  <header><h1>상담 관리</h1><p>주문별 고객 상담을 확인하고 답변합니다.</p></header>
  <div class="chat-admin-layout">
    <aside><h2>상담 목록</h2><ol data-chat-conversations class="chat-conversations"></ol></aside>
    <section class="chat-panel" data-chat-conversation-id="">
      <div class="chat-panel-head"><p class="chat-status" data-chat-status aria-live="polite">상담을 선택하세요.</p><button type="button" data-chat-status-toggle hidden></button></div>
      <button type="button" class="chat-secondary" data-chat-load-more hidden>이전 메시지 더 보기</button>
      <ol class="chat-messages" data-chat-messages aria-live="polite"></ol>
      <form data-chat-message-form>
        <label for="chat-body">답변</label>
        <textarea id="chat-body" data-chat-body maxlength="2000" required placeholder="답변 내용을 입력하세요."></textarea>
        <button type="submit" data-chat-send>보내기</button>
      </form>
    </section>
  </div>
</main>
<script th:src="@{/js/chat-client.js}" defer></script>
</body>
</html>
