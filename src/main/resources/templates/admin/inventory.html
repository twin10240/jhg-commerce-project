<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>재고 관리 · OMS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:18px 0}
    .stat{padding:18px;border:1px solid var(--app-line);border-radius:8px;background:#fff}.stat b{display:block;font-size:28px;margin-top:6px}.stat span{color:var(--app-muted)}
    .inventory-table{width:100%;border-collapse:collapse;margin-top:18px}.inventory-table th,.inventory-table td{padding:13px 10px;border-bottom:1px solid var(--app-line);text-align:left}.inventory-table th{color:var(--app-muted);font-size:13px}.number{text-align:right!important;font-variant-numeric:tabular-nums}
    .inventory-table tr.risk{background:#fff9ed}.row-actions{white-space:nowrap}
    .connection-error{margin:18px 0;padding:16px;border:1px solid #e3b4ac;border-radius:12px;background:#fdeaea;color:var(--app-danger);font-weight:700}
    @media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:720px){.stats{grid-template-columns:1fr}.mobile-hide{display:none}.inventory-table th,.inventory-table td{padding:10px 6px}.app-btn{padding:8px}}
    @media(prefers-color-scheme:dark){.stat{background:#211e1b}.inventory-table tr.risk{background:#2b2418}}
  </style>
</head>
<body style="margin:0;padding:24px;background:var(--app-bg);color:var(--app-ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif">
<div th:replace="~{fragments/layout :: nav('inventory')}"></div>
<main class="app-shell">
  <header>
    <h1 class="app-title">재고 현황</h1>
    <p class="app-subtitle">WMS 재고와 OMS 입고 대기 수요를 함께 확인합니다.</p>
  </header>
  <div class="connection-error" role="alert" th:if="${inventoryUnavailable}">
    WMS에 연결할 수 없어 재고 수량을 표시하지 않습니다. WMS 서버 상태를 확인한 뒤 새로고침해 주세요.
  </div>

  <section class="stats" aria-label="재고 요약" th:unless="${inventoryUnavailable}">
    <div class="stat"><span>가용재고 0 상품</span><b th:text="${soldOutCount}">0</b></div>
    <div class="stat"><span>가용재고 10개 미만</span><b th:text="${lowStockCount}">0</b></div>
    <div class="stat"><span>백오더 총수량</span><b th:text="${backorderQty}">0</b></div>
    <div class="stat"><span>입고 필요 수량</span><b th:text="${inboundRequiredQty}">0</b></div>
    <div class="stat"><span>할당 대기 수량</span><b th:text="${allocationWaitingQty}">0</b></div>
  </section>

  <section class="app-card" th:unless="${inventoryUnavailable}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <h2 style="margin:0 0 4px">상품별 재고</h2>
        <span class="app-subtitle">가용 = 보유 − 예약</span>
      </div>
      <a class="app-btn secondary" th:href="@{/admin/replenishment-requests}">보충 요청 이력</a>
    </div>
    <div class="table-wrap">
      <table class="inventory-table">
        <thead><tr><th>상품</th><th class="number mobile-hide">보유</th><th class="number mobile-hide">예약</th><th class="number">가용</th><th class="number">백오더 수량</th><th>상태</th><th>작업</th></tr></thead>
        <tbody>
        <tr th:each="product : ${products}" th:classappend="${product.availableQty <= 0 or backorderDemand.getOrDefault(product.productId, 0) > 0} ? 'risk'">
          <td><strong th:text="${product.productName}">상품 1</strong><br><small th:text="|#${product.productId}|">#1</small></td>
          <td class="number mobile-hide" th:text="${product.onHandQty}">15</td>
          <td class="number mobile-hide" th:text="${product.reservedQty}">3</td>
          <td class="number" th:text="${product.availableQty}">12</td>
          <td class="number" th:text="${backorderDemand.getOrDefault(product.productId, 0)}">0</td>
          <td>
            <span class="status-badge status-backordered" th:if="${product.availableQty == 0}">품절</span>
            <span class="status-badge status-backordered" th:if="${product.availableQty > 0 and product.availableQty < 10}">재고 부족</span>
            <span class="status-badge status-order" th:if="${product.availableQty >= 10}">정상</span>
          </td>
          <td class="row-actions">
            <a class="app-btn secondary" th:if="${pendingRequests.containsKey(product.productId)}"
               th:href="|/admin/replenishment-requests#request-${pendingRequests.get(product.productId)}|">요청 진행 중</a>
            <a class="app-btn" th:unless="${pendingRequests.containsKey(product.productId)}"
               th:href="@{/admin/replenishment-requests(productId=${product.productId})}">보충 요청</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}"><td colspan="7" class="empty-state">WMS 재고를 불러오지 못했거나 등록된 상품이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
