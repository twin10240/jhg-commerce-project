<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${product.name} · 그니마켓|">상품 상세</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="margin:0;padding:24px;background:var(--app-bg);color:var(--app-ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif">
<div th:replace="~{fragments/layout :: nav('products')}"></div>
<main class="app-shell">
  <article class="app-card product-detail">
    <img class="product-art" th:src="@{/images/product-catalog.png}" alt="">
    <div>
      <a th:href="@{/main}" style="color:var(--app-muted);text-decoration:none">← 상품 목록</a>
      <h1 class="app-title" th:text="${product.name}" style="margin-top:18px">상품명</h1>
      <p class="product-price"><span th:text="${#numbers.formatInteger(product.price,1,'COMMA')}">10,000</span>원</p>
      <form class="purchase-actions" sec:authorize="hasRole('USER')" th:action="@{/orders/checkout-form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="productId" th:value="${product.id}">
        <div class="purchase-quantity">
          <span>수량</span>
          <div class="quantity-stepper">
            <button type="button" class="qty-minus" aria-label="수량 감소">−</button>
            <input type="number" name="qty" min="1" step="1" value="1">
            <button type="button" class="qty-plus" aria-label="수량 증가">＋</button>
          </div>
        </div>
        <button class="app-btn" id="purchaseButton" type="submit" th:text="${product.availableQty >= 1 ? '주문하기' : '입고 대기 주문하기'}">주문하기</button>
      </form>
      <p id="stockDecision" sec:authorize="hasRole('USER')" th:attr="data-available=${product.availableQty}"
         th:hidden="${product.availableQty >= 1}"
         th:text="|선택 수량보다 ${1 - product.availableQty}개 부족합니다. 주문 시 1개 전체가 입고 대기로 접수됩니다.|">
        재고 부족
      </p>
      <a class="app-btn secondary" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/inventory}">재고에서 확인</a>
    </div>
  </article>
</main>
<script>
  const stepper = document.querySelector('.quantity-stepper');
  const quantityInput = stepper?.querySelector('input');
  function updateStockDecision() {
    const decision = document.getElementById('stockDecision');
    if (!decision || !quantityInput) return;
    const qty = Math.max(1, Number(quantityInput.value) || 1);
    const available = Number(decision.dataset.available) || 0;
    const ready = available >= qty;
    decision.hidden = ready;
    if (!ready) decision.textContent =
      `선택 수량보다 ${qty - available}개 부족합니다. 주문 시 ${qty}개 전체가 입고 대기로 접수됩니다.`;
    document.getElementById('purchaseButton').textContent = ready ? '주문하기' : '입고 대기 주문하기';
  }
  stepper?.addEventListener('click', (event) => {
    const button = event.target.closest('.qty-minus,.qty-plus');
    if (!button) return;
    const input = button.parentElement.querySelector('input');
    input.value = String(Math.max(1, Number(input.value) || 1));
    button.classList.contains('qty-plus') ? input.stepUp() : input.stepDown();
    updateStockDecision();
  });
  quantityInput?.addEventListener('input', updateStockDecision);
  updateStockDecision();
</script>
</body>
</html>
